<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElfaSales</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #101820; color: #eef3f8; }
    main { max-width: 420px; margin: 0 auto; padding: 20px 16px 96px; }
    h1 { margin: 8px 0 4px; font-size: 28px; }
    p.hint { margin: 0 0 16px; color: #9aafc3; }
    .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .city { background: #182433; color: #eef3f8; border: 1px solid #2c3e52; padding: 14px 8px; }
    .city.on { background: #6cb6ff; color: #071018; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    article { border: 1px solid #2c3e52; background: #182433; border-radius: 16px; padding: 12px; min-height: 140px; display: flex; flex-direction: column; }
    button { cursor: pointer; border: 0; border-radius: 12px; font-weight: 700; }
    .add, .buy { background: #6cb6ff; color: #071018; }
    .add { margin-top: auto; align-self: flex-end; width: 40px; height: 40px; border-radius: 999px; }
    .buy, .ghost { width: 100%; padding: 14px; margin-top: 12px; }
    .ghost { background: transparent; color: #eef3f8; border: 1px solid #2c3e52; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px; background: #101820; border-top: 1px solid #2c3e52; padding: 8px; }
    nav button { background: transparent; color: #9aafc3; min-width: 72px; min-height: 44px; }
    nav button.on { color: #6cb6ff; }
    .price { color: #e8b86d; }
    .screen { display: none; }
    .screen.on { display: block; }
    textarea { width: 100%; margin: 6px 0 10px; padding: 12px; border-radius: 12px; border: 1px solid #2c3e52; background: #182433; color: inherit; }
  </style>
</head>
<body>
  <main>
    <strong>ElfaSales</strong>
    <section id="catalog" class="screen on">
      <div class="cities">
        <button type="button" class="city on" data-city="reutlingen">Reutlingen</button>
        <button type="button" class="city" data-city="tubingen">Tübingen</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="cart" class="screen">
      <h1>Корзина</h1>
      <div id="cartBox"></div>
    </section>
    <section id="profile" class="screen">
      <h1>Профиль</h1>
      <p class="hint" id="orders">Заказов пока нет.</p>
    </section>
    <section id="admin" class="screen">
      <h1>Админ</h1>
      <p class="hint">Кнопки-заглушки. Потом закроем эту вкладку только для тебя.</p>
      <button class="ghost" data-fake="Товар">Товар</button>
      <button class="ghost" data-fake="Заказы">Заказы</button>
      <button class="ghost" data-fake="Клиенты">Клиенты</button>
      <p class="hint" id="fake"></p>
    </section>
  </main>
  <nav>
    <button class="on" data-tab="catalog">Каталог</button>
    <button data-tab="cart">Корзина</button>
    <button data-tab="profile">Профиль</button>
    <button data-tab="admin">Админ</button>
  </nav>
  <script>
    const products = [];
    let city = "reutlingen";
    const cart = {};
    const orders = [];
    const rub = (n) => n + " ₽";

    function draw() {
      document.querySelectorAll(".city").forEach((b) => b.classList.toggle("on", b.dataset.city === city));
      const list = products.filter((p) => p.city === city);
      document.getElementById("grid").innerHTML = list.length
        ? list.map((p) => `
        <article>
          <strong>${p.name}</strong>
          <p class="hint">${p.ml} мл · ${p.mg} мг</p>
          <span class="price">${rub(p.price)}</span>
          <button class="add" data-add="${p.id}">+</button>
        </article>`).join("")
        : "<p class='hint'>В этом городе пока нет товаров.</p>";
      const rows = Object.entries(cart);
      const box = document.getElementById("cartBox");
      if (!rows.length) {
        box.innerHTML = "<p class='hint'>Пусто</p>";
        return;
      }
      let total = 0;
      box.innerHTML = rows.map(([id, qty]) => {
        const p = products.find((x) => x.id === id);
        total += p.price * qty;
        return `<p>${p.name} × ${qty}</p>`;
      }).join("") + `<button class="buy" id="buy">Купить · ${rub(total)}</button>`;
      document.getElementById("buy").onclick = () => {
        const id = "ES-" + (1042 + orders.length);
        orders.push(id);
        for (const k of Object.keys(cart)) delete cart[k];
        document.getElementById("orders").textContent = "Заказы: " + orders.join(", ");
        alert("Заказ оформлен: " + id);
        draw();
        show("profile");
      };
    }

    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
    }

    document.body.addEventListener("click", (e) => {
      const cityBtn = e.target.closest("[data-city]");
      if (cityBtn) {
        city = cityBtn.dataset.city;
        draw();
      }
      const add = e.target.closest("[data-add]");
      if (add) {
        cart[add.dataset.add] = (cart[add.dataset.add] || 0) + 1;
        draw();
      }
      const tab = e.target.closest("[data-tab]");
      if (tab) show(tab.dataset.tab);
      const fake = e.target.closest("[data-fake]");
      if (fake) document.getElementById("fake").textContent = fake.dataset.fake + ": пока пусто";
    });
    const ADMIN_ID = 7648089072;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    const myId = tgUser ? Number(tgUser.id) : 0;
    if (myId !== ADMIN_ID) {
      const adminBtn = document.querySelector('[data-tab="admin"]');
      if (adminBtn) adminBtn.remove();
    }
    draw();
  </script>
</body>
</html>
