<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElfaSales</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, Segoe UI, sans-serif; font-weight: 600; background: #101820; color: #eef3f8; }
    .price { color: #fff; font-weight: 800; font-size: 15px; display: block; margin-top: 12px; }
    .stockline { color: #fff; font-size: 13px; font-weight: 600; display: block; margin-top: 6px; }
    main { max-width: 420px; margin: 0 auto; padding: 20px 16px 120px; }
    h1 { margin: 8px 0 4px; font-size: 28px; }
    p.hint { margin: 0 0 16px; color: #9aafc3; font-weight: 800; }
    .brand { font-size: 22px; }
    .cities, .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .menu { grid-template-columns: 1fr; }
    .city, .menu button, .plus { background: #182433; color: #eef3f8; border: 1px solid #2c3e52; padding: 18px 8px; font-size: 16px; min-height: 58px; }
    .emptycart { min-height: 52vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
    .emptycart .bubble { width: 88px; height: 88px; border-radius: 50%; background: #1c2633; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .emptycart strong { font-size: 22px; font-weight: 700; }
    .emptycart span { color: #9aafc3; font-size: 15px; font-weight: 600; }
    .cities .city { font-weight: 500; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .stat { background: #182433; border: 1px solid #2c3e52; border-radius: 16px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 12px; }
    .stat span { font-size: 15px; }
    .stat strong { font-size: 36px; }
    .city.on, .stock.on { background: #6cb6ff; color: #071018; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    article, .shot { border: 0; background: #182433; border-radius: 16px; overflow: hidden; }
    article { min-height: 180px; display: flex; flex-direction: column; padding: 0; text-align: left; color: inherit; width: 100%; }
    article img, .shot img { width: 100%; aspect-ratio: 1; height: auto; object-fit: cover; background: #fff; display: block; }
    button.card { padding: 0; width: 100%; display: block; background: transparent; text-align: left; }
    article { position: relative; }
    .badge { position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 4px 6px; border-radius: 8px; }
    .badge.yes { background: #6cb6ff; color: #071018; }
    .badge.no { background: #243246; color: #9aafc3; }
    .pad { display: block; padding: 12px; }
    article strong { display: block; padding: 0; font-weight: 700; }
    button { cursor: pointer; border: 0; border-radius: 16px; font-family: inherit; font-weight: 800; }
    .buy { background: #6cb6ff; color: #071018; width: 100%; padding: 16px; margin-top: 12px; font-size: 17px; }
    .buy:disabled { background: #2c3e52; color: #9aafc3; }
    .ghost { background: transparent; color: #eef3f8; border: 1px solid #2c3e52; width: 100%; padding: 14px; margin-top: 8px; }
    .back { background: transparent; color: #6cb6ff; padding: 0 0 8px; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; background: #101820; border-top: 1px solid #2c3e52; padding: 10px 8px 14px; }
    nav button { background: #182433; color: #9aafc3; border: 1px solid #2c3e52; width: 78px; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; }
    nav button svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    nav button.on { color: #071018; background: #6cb6ff; border-color: #6cb6ff; }
    .screen { display: none; }
    .screen.on { display: block; }
    input, select, textarea { width: 100%; margin: 6px 0 10px; padding: 14px; border-radius: 12px; border: 1px solid #2c3e52; background: #182433; color: inherit; font-family: inherit; font-weight: 800; font-size: 16px; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 8px 0; padding: 12px; border: 1px solid #2c3e52; border-radius: 16px; }
    .plus { font-size: 32px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ElfaSales</div>
    <section id="catalog" class="screen on">
      <div class="cities">
        <button type="button" class="city on" data-city="reutlingen">Reutlingen</button>
        <button type="button" class="city" data-city="tubingen">Tübingen</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="detail" class="screen">
      <button class="back" type="button" data-tab="catalog">Назад</button>
      <div id="detailBox"></div>
    </section>
    <section id="cart" class="screen">
      <h1>Корзина</h1>
      <div id="cartBox"></div>
    </section>
    <section id="profile" class="screen">
  <h1>Профиль</h1>
  <p class="hint" id="clientNo">Номер клиента: —</p>
  <div class="stats">
    <div class="stat"><span>Куплено</span><strong id="boughtCount">0</strong></div>
    <div class="stat"><span>Активные заказы</span><strong id="activeCount">0</strong></div>
  </div>
  <button type="button" class="ghost" data-tab="rules">Правила</button>
</section>
<section id="rules" class="screen">
  <button class="back" type="button" data-tab="profile">Назад</button>
  <h1>Правила</h1>
  <p>Текст правил добавим отдельно.</p>
</section>
    <section id="admin" class="screen">
      <h1>Админ</h1>
      <div id="adminMenu" class="menu">
        <button type="button" data-admin="goods">Товары</button>
        <button type="button" data-admin="orders">Заказы</button>
        <button type="button" data-admin="clients">Клиенты</button>
      </div>
      <div id="adminGoods" class="screen">
        <button class="back" type="button" data-admin="menu">Назад</button>
        <div class="cities">
          <button type="button" class="city on" data-admin-city="reutlingen">Reutlingen</button>
          <button type="button" class="city" data-admin-city="tubingen">Tübingen</button>
        </div>
        <div id="adminList"></div>
        <button class="plus" type="button" id="openForm">+</button>
      </div>
      <div id="adminForm" class="screen">
        <button class="back" type="button" data-admin="goods">Назад</button>
        <input id="pPhoto" type="file" accept="image/*" />
        <input id="pName" placeholder="Название" />
        <input id="pMg" type="number" placeholder="Крепость, мг" />
        <input id="pMl" type="number" placeholder="Миллилитры" />
        <input id="pPrice" type="number" placeholder="Цена, €" />
        <textarea id="pText" placeholder="Описание"></textarea>
        <input id="pQty" type="number" placeholder="Сколько штук" />
        <button class="stock on" id="pStock" type="button">В наличии</button>
        <button class="buy" id="saveProduct" type="button">Сохранить</button>
        <p class="hint" id="saveMsg"></p>
      </div>
      <div id="adminOrders" class="screen">
  <button class="back" type="button" data-admin="menu">Назад</button>
  <div id="orderList"><p class="hint">Заказов пока нет.</p></div>
</div>
      <div id="adminClients" class="screen">
  <button class="back" type="button" data-admin="menu">Назад</button>
  <p class="hint" id="clientCount">Пользователей: 0</p>
  <div id="clientList"></div>
</div>
    </section>
  </main>
  <nav>
    <button class="on" data-tab="catalog">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Каталог
    </button>
    <button data-tab="cart">
      <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      Корзина
    </button>
    <button data-tab="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3 3.8-4.5 7-4.5S17.6 16 19 19"/></svg>
      Профиль
    </button>
    <button data-tab="admin">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
      Админ
    </button>
  </nav>
  <script>
    const API = "https://elfasales-production.up.railway.app";
    let products = [];
    let city = "reutlingen";
    let adminCity = "reutlingen";
    let photo = "";
    let inStock = true;
    let editing = null;
    let opened = null;
    const cart = {};
    let payment = "";
    let orderNote = "";
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();
    const initHeader = { "x-telegram-init": tg && tg.initData ? tg.initData : "" };

    function cityName(id) { return id === "tubingen" ? "Tübingen" : "Reutlingen"; }
    function pic(p) {
      return p.photo
        ? `<img src="${p.photo}" alt="">`
        : `<img alt="" style="background:#243246">`;
    }

    async function loadProducts() {
      const res = await fetch(API + "/api/products");
      if (!res.ok) throw new Error("api");
      products = await res.json();
    }

    function draw() {
      document.querySelectorAll("[data-city]").forEach((b) => b.classList.toggle("on", b.dataset.city === city));
      document.querySelectorAll("[data-admin-city]").forEach((b) => b.classList.toggle("on", b.dataset.adminCity === adminCity));
      const list = products.filter((p) => p.city === city);
      document.getElementById("grid").innerHTML = list.length
        ? list.map((p) => `<button class="card" data-open="${p.id}"><article>${pic(p)}<div class="pad"><strong>${p.name}</strong><span class="price">${Number(p.price).toFixed(2)} EUR</span><span class="stockline">${p.in_stock && Number(p.qty) > 0 ? "В наличии: " + p.qty : "Нет в наличии"}</span></div></article></button>`).join("")
        : "<p class='hint'>В этом городе пока нет товаров.</p>";
      const mine = products.filter((p) => p.city === adminCity);
      document.getElementById("adminList").innerHTML = mine.map((p) => `
        <div class="row">
          <button class="ghost" data-edit="${p.id}" style="width:auto;margin:0;padding:10px 14px;border:0">${p.name}</button>
          <button class="ghost" data-del="${p.id}" style="width:auto;margin:0;padding:10px 14px">Удалить</button>
        </div>`).join("") || "<p class='hint'>Пока пусто. Нажми плюс.</p>";
      const rows = Object.entries(cart);
const box = document.getElementById("cartBox");
if (orderNote && !rows.length) {
  box.innerHTML = `<button type="button" class="back" id="orderBack">Назад</button><p>${orderNote}</p><button type="button" class="buy" id="writeManager">Связаться с менеджером</button>`;
} else if (!rows.length) {
  box.innerHTML = "<p class='hint'>Пусто</p>";
} else {
  let total = 0;
  const lines = rows.map(([id, qty]) => {
    const p = products.find((x) => x.id === id);
    if (!p) return "";
    total += Number(p.price) * qty;
    return `<p>${p.name} × ${qty} · ${Number(p.price) * qty} €</p>`;
  }).join("");
  box.innerHTML = lines + `
    <p class="price">Итого: ${total} €</p>
    <p class="hint">Оплата</p>
    <button type="button" class="ghost ${payment === "cash" ? "stock on" : ""}" data-pay="cash">Наличные</button>
    <button type="button" class="ghost ${payment === "bank" ? "stock on" : ""}" data-pay="bank">Банковский перевод</button>
    <button type="button" class="buy" id="checkout" ${payment ? "" : "disabled"}>Оформить заказ</button>`;
}
      if (!opened) return;
      const p = products.find((x) => x.id === opened);
      if (!p) return;
      const can = p.in_stock && Number(p.qty) > 0;
      document.getElementById("detailBox").innerHTML = `
        <div class="shot">${pic(p)}</div>
        <h1>${p.name}</h1>
        <p class="hint">${p.ml} мл · ${p.mg} мг · ${cityName(p.city)}</p>
        <p>${p.description || "Без описания"}</p>
        <p class="price">${Number(p.price).toFixed(2)} EUR</p>
        <p class="stockline">${can ? "В наличии: " + p.qty : "Нет в наличии"}</p>
        <button class="buy" id="addCart" ${can ? "" : "disabled"}>${can ? "Добавить в корзину" + (cart[p.id] ? " · " + cart[p.id] : "") : "Нет в наличии"}</button>`;
      const add = document.getElementById("addCart");
      if (add && can) add.onclick = () => {
        cart[p.id] = (cart[p.id] || 0) + 1;
        draw();
      };
    }

    function show(id) {
      document.querySelectorAll("main > .screen, main section.screen").forEach((s) => s.classList.toggle("on", s.id === id));
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
    }
    function showAdmin(name) {
      ["adminMenu", "adminGoods", "adminForm", "adminOrders", "adminClients"].forEach((id) => {
        document.getElementById(id).classList.toggle("on", id === "admin" + name.charAt(0).toUpperCase() + name.slice(1) || id === "adminMenu" && name === "menu");
      });
      document.getElementById("adminMenu").classList.toggle("on", name === "menu");
      document.getElementById("adminGoods").classList.toggle("on", name === "goods");
      document.getElementById("adminForm").classList.toggle("on", name === "form");
      document.getElementById("adminOrders").classList.toggle("on", name === "orders");
      document.getElementById("adminClients").classList.toggle("on", name === "clients");
    }

    document.getElementById("pPhoto").onchange = () => {
      const file = document.getElementById("pPhoto").files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        photo = canvas.toDataURL("image/jpeg", 0.72);
      };
      img.src = URL.createObjectURL(file);
    };
    document.getElementById("pStock").onclick = () => {
      inStock = !inStock;
      const b = document.getElementById("pStock");
      b.classList.toggle("on", inStock);
      b.textContent = inStock ? "В наличии" : "Нет в наличии";
    };
    document.getElementById("openForm").onclick = () => { editing = null; photo = ""; showAdmin("form"); };
    document.getElementById("saveProduct").onclick = async () => {
      const msg = document.getElementById("saveMsg");
      const res = await fetch(API + "/api/products", {
        method: editing ? "PUT" : "POST",
        headers: { "content-type": "application/json", ...initHeader },
        body: JSON.stringify({
          city: adminCity,
          name: document.getElementById("pName").value,
          mg: document.getElementById("pMg").value,
          ml: document.getElementById("pMl").value,
          description: document.getElementById("pText").value,
          qty: document.getElementById("pQty").value,
          price: document.getElementById("pPrice").value,
          inStock,
          photo,
          id: editing,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.textContent = data.error || "Не сохранилось";
        return;
      }
      msg.textContent = "Сохранено";
      document.getElementById("pName").value = "";
      document.getElementById("pText").value = "";
      photo = "";
      await loadProducts();
      draw();
      showAdmin("goods");
    };

    function writeManager() {
  const link = "https://t.me/manager_elfasales";
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link);
  else window.location.href = link;
}
async function placeOrder() {
  const items = Object.entries(cart).map(([id, qty]) => ({ id, qty }));
  const res = await fetch(API + "/api/orders", {
    method: "POST",
    headers: { "content-type": "application/json", ...initHeader },
    body: JSON.stringify({ items, payment, city }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    alert(data.error || "Не оформилось");
    return;
  }
  for (const key of Object.keys(cart)) delete cart[key];
  payment = "";
  orderNote = "Ваш заказ принят. Напишите менеджеру для места встречи и времени.";
  await loadProducts();
  draw();
  show("cart");
}
async function loadClients() {
  const res = await fetch(API + "/api/clients", { headers: initHeader });
  const list = await res.json().catch(() => []);
  const people = Array.isArray(list) ? list : [];
  document.getElementById("clientCount").textContent = "Пользователей: " + people.length;
  const box = document.getElementById("clientList");
  if (!people.length) {
    box.innerHTML = "<p class='hint'>Пока никого нет. Пусть человек нажмёт /start.</p>";
    return;
  }
  box.innerHTML = people.map((person) => {
    const blocked = person.blocked === true;
    const button = blocked
      ? `<button type="button" class="ghost" data-block="0" data-user="${person.user_id}">Разблокировать</button>`
      : `<button type="button" class="ghost" data-block="1" data-user="${person.user_id}">Заблокировать</button>`;
    return `<div class="stat" style="width:100%;margin:0 0 10px"><span>${person.name || "Без имени"}</span><span>@${person.username || "нет"}</span><span>Id: ${person.user_id}</span>${button}</div>`;
  }).join("");
}
    async function loadOrders() {
  const listBox = document.getElementById("orderList");
  const res = await fetch(API + "/api/orders", { headers: initHeader });
  const list = await res.json().catch(() => []);
  if (!res.ok || !Array.isArray(list) || !list.length) {
    listBox.innerHTML = "<p class='hint'>Заказов пока нет.</p>";
    return;
  }
  listBox.innerHTML = list.map((order) => {
    const items = Array.isArray(order.items) ? order.items : [];
    const pay = order.payment === "bank" ? "Банковский перевод" : "Наличные";
    const statusName = order.status === "done" ? "Выполнен" : order.status === "cancelled" ? "Отменён" : "Новый";
    return `<div class="row" style="display:block"><strong>${order.id}</strong><p class="hint">${order.user_name || "Клиент"} · ${pay} · ${order.total} € · ${statusName}</p><p>${items.map((item) => item.name + " × " + item.qty).join(", ")}</p><button type="button" class="ghost" data-status="done" data-id="${order.id}">Выполнен</button><button type="button" class="ghost" data-status="cancelled" data-id="${order.id}">Отменён</button><button type="button" class="ghost" data-del-order="${order.id}">Удалить</button></div>`;
  }).join("");
}
    
  async function loadProfile() {
  const res = await fetch(API + "/api/my-orders", { headers: initHeader });
  const data = await res.json().catch(() => ({}));
  document.getElementById("clientNo").textContent = "Номер клиента: " + (data.code || "—");
  document.getElementById("boughtCount").textContent = data.bought || 0;
  document.getElementById("activeCount").textContent = data.active || 0;
}

    
    document.body.addEventListener("click", async (e) => {
      const cityBtn = e.target.closest("[data-city]");
      if (cityBtn) { city = cityBtn.dataset.city; draw(); }
      const adminCityBtn = e.target.closest("[data-admin-city]");
      if (adminCityBtn) { adminCity = adminCityBtn.dataset.adminCity; draw(); }
      const open = e.target.closest("[data-open]");
      if (open) { opened = open.dataset.open; draw(); show("detail"); }
      const tab = e.target.closest("[data-tab]");
      if (tab) { show(tab.dataset.tab); if (tab.dataset.tab === "profile") loadProfile(); }
      const adminBtn = e.target.closest("[data-admin]");
      if (adminBtn) showAdmin(adminBtn.dataset.admin);
      if (adminBtn && adminBtn.dataset.admin === "orders") loadOrders();
      if (adminBtn && adminBtn.dataset.admin === "clients") loadClients();
      const payBtn = e.target.closest("[data-pay]");
      if (payBtn) { payment = payBtn.dataset.pay; draw(); }
      if (e.target.closest("#checkout")) placeOrder();
      if (e.target.closest("#orderBack")) { orderNote = ""; show("catalog"); }
      if (e.target.closest("#writeManager")) writeManager();
      const statusBtn = e.target.closest("[data-status]");
if (statusBtn) {
  await fetch(API + "/api/orders/status", {
    method: "POST",
    headers: { "content-type": "application/json", ...initHeader },
    body: JSON.stringify({ id: statusBtn.dataset.id, status: statusBtn.dataset.status }),
  });
  await loadOrders();
}
const delOrder = e.target.closest("[data-del-order]");
if (delOrder) {
  await fetch(API + "/api/orders?id=" + encodeURIComponent(delOrder.dataset.delOrder), { method: "DELETE", headers: initHeader });
  await loadOrders();
}
      const blockBtn = e.target.closest("[data-block]");
if (blockBtn) {
  await fetch(API + "/api/clients/block", {
    method: "POST",
    headers: { "content-type": "application/json", ...initHeader },
    body: JSON.stringify({ id: blockBtn.dataset.user, blocked: blockBtn.dataset.block === "1" }),
  });
  await loadClients();
}
      const del = e.target.closest("[data-del]");
      if (del) {
        await fetch(API + "/api/products?id=" + encodeURIComponent(del.dataset.del), { method: "DELETE", headers: initHeader });
        await loadProducts();
        draw();
      }
      const edit = e.target.closest("[data-edit]");
if (edit) {
  const p = products.find((x) => x.id === edit.dataset.edit);
  if (!p) return;
  editing = p.id;
  adminCity = p.city;
  photo = "";
  document.getElementById("pName").value = p.name;
  document.getElementById("pMg").value = p.mg;
  document.getElementById("pMl").value = p.ml;
  document.getElementById("pPrice").value = p.price;
